services:
  api:
    build: .
    container_name: sernanp-api
    restart: always
    ports:
      - '4005:4005'
    env_file:
      - .env
    environment:
      # El contenedor es el unico responsable de procesar trabajos desplegados.
      WORKERS_ENABLED: 'true'
      # Un despliegue nunca debe capturar correos silenciosamente en disco.
      MAIL_MODE: smtp
